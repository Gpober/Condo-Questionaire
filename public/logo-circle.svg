<svg viewBox="0 0 304 76" width="304" height="76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HOA Daddy">
  <defs>
    <linearGradient id="hdlc-grad" x1="8" y1="8" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#008e97"/>
      <stop offset="1" stop-color="#fc4c02"/>
    </linearGradient>
    <linearGradient id="hdlc-word" x1="150" y1="24" x2="244" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#008e97"/>
      <stop offset="1" stop-color="#fc4c02"/>
    </linearGradient>
  </defs>

  <!-- Circle icon badge -->
  <circle cx="38" cy="38" r="32" fill="url(#hdlc-grad)"/>
  <!-- taller condo tower -->
  <rect x="21" y="24" width="18" height="30" rx="2.6" fill="#ffffff" fill-opacity="0.96"/>
  <!-- tower windows -->
  <g fill="#008e97">
    <rect x="25" y="29" width="3.6" height="3.6" rx="0.8"/>
    <rect x="31.2" y="29" width="3.6" height="3.6" rx="0.8"/>
    <rect x="25" y="35.2" width="3.6" height="3.6" rx="0.8"/>
    <rect x="31.2" y="35.2" width="3.6" height="3.6" rx="0.8"/>
    <rect x="25" y="41.4" width="3.6" height="3.6" rx="0.8"/>
    <rect x="31.2" y="41.4" width="3.6" height="3.6" rx="0.8"/>
  </g>
  <!-- shorter front building -->
  <rect x="37" y="33" width="19" height="21" rx="2.6" fill="#ffffff" fill-opacity="0.72"/>
  <!-- checkmark — nods to the questionnaire -->
  <path d="M40.8 44l3.7 3.7 7.2-7.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="84" y="48" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#0b1324">HOA</tspan><tspan fill="url(#hdlc-word)" dx="8">Daddy</tspan>
  </text>
</svg>
