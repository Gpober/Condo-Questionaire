<svg viewBox="0 0 300 76" width="300" height="76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HOA Daddy">
  <defs>
    <linearGradient id="hd-grad" x1="8" y1="10" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="hd-word" x1="150" y1="24" x2="240" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="8" y="10" width="56" height="56" rx="15" fill="url(#hd-grad)"/>
  <!-- taller condo tower -->
  <rect x="20" y="24" width="17" height="30" rx="2.4" fill="#ffffff" fill-opacity="0.96"/>
  <!-- tower windows -->
  <g fill="#0d9488">
    <rect x="24" y="29" width="3.4" height="3.4" rx="0.7"/>
    <rect x="29.8" y="29" width="3.4" height="3.4" rx="0.7"/>
    <rect x="24" y="35.2" width="3.4" height="3.4" rx="0.7"/>
    <rect x="29.8" y="35.2" width="3.4" height="3.4" rx="0.7"/>
    <rect x="24" y="41.4" width="3.4" height="3.4" rx="0.7"/>
    <rect x="29.8" y="41.4" width="3.4" height="3.4" rx="0.7"/>
  </g>
  <!-- shorter front building -->
  <rect x="35.5" y="33" width="18.5" height="21" rx="2.4" fill="#ffffff" fill-opacity="0.72"/>
  <!-- checkmark — nods to the questionnaire -->
  <path d="M39.4 44.4l3.7 3.7 7.1-7.4" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="80" y="48" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#0b1324">HOA</tspan><tspan fill="url(#hd-word)" dx="8">Daddy</tspan>
  </text>
</svg>
